services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Partilha a rede com o MySQL: a aplicação liga-se a 127.0.0.1:3306,
    # como no .env.example.
    network_mode: service:db

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Os triggers de imutabilidade do ledger exigem esta opção quando o
    # binlog está ligado (o padrão no MySQL 8).
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thandizo
      MYSQL_USER: thandizo
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro

volumes:
  mysql-data:
